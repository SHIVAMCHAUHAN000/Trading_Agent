[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Indian Market Strategy Research & Backtesting Agent (no trade execution)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "SHIVAMCHAUHAN000" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "yfinance>=0.2.40",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]
llm = [
  "openai>=1.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "analytics*",
  "backtesting*",
  "database*",
  "market_data*",
  "reports_ui*",
  "strategies*",
  "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
