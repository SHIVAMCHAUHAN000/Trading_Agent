[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Personal Live Quant Brain & Research Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "SHIVAMCHAUHAN000" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "yfinance>=0.2.40",
  "pydantic>=2.6",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "python-telegram-bot>=21.0",
  "google-genai>=1.0.0",
  "openai>=1.30.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.3",
]
research = [
  "pyarrow>=14",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "analytics*",
  "backtesting*",
  "brain*",
  "config*",
  "database*",
  "live_data*",
  "market_data*",
  "mcp_tools*",
  "quant*",
  "reports_ui*",
  "server*",
  "storage*",
  "strategies*",
  "telegram_bot*",
  "tradingview*",
  "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "main.py"

